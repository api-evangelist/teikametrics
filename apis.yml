aid: teikametrics
name: Teikametrics
description: 'Teikametrics is a Boston-based commerce optimization company founded
  by Alasdair McLean-Foreman that builds ARI (Artificial Retail Intelligence), an AI
  platform for brands and sellers operating on Amazon, Walmart and TikTok Shop. The
  platform ingests advertising, catalog, sales and inventory data pulled from marketplace
  APIs (Amazon Advertising, Amazon Selling Partner, Walmart Marketplace and Ads, TikTok
  Shop) and applies retail-trained models to bid management, keyword harvesting, listing
  and feed optimization, demand forecasting and profit-based reporting. Product surfaces
  include Compass dashboards, the Recommendation Hub, Product Catalog, Advertising
  Optimization, Inventory Optimization, Market IQ and Business Intelligence, plus an
  Agency Edition with nested client accounts. Teikametrics is an API consumer rather
  than an API producer: as of this profiling pass it publishes no public developer
  portal, no OpenAPI or other machine-readable contract, and no customer-facing API
  reference — integration happens through OAuth-style marketplace channel connections
  made inside the application.'
