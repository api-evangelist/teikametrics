summary: >-
  No first-party Teikametrics /.well-known/ document was found on any host. The
  marketing site (www.teikametrics.com, WordPress/WP Engine) returns 404 for every
  probed path. The application host (app.teikametrics.com) is a single-page app whose
  catch-all route answers HTTP 200 with an HTML shell for EVERY /.well-known/* path —
  those 200s are false positives and are recorded as such, not as discovery documents.
  The one real 200 with a non-HTML body is an RFC 9116 security.txt served on the
  Intercom-hosted help centre; its own Canonical field points at
  https://app.intercom.com/.well-known/security.txt, so it is Intercom's disclosure
  policy, not Teikametrics'. It is saved as evidence only and deliberately carries no
  SecurityTxt / Security / VulnerabilityDisclosure pointer in apis.yml.
